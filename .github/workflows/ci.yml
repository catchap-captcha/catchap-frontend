name: CI

# 배포 전 게이트 — push/PR마다 타입체크·빌드·린트. VITE_* 시크릿은 컴파일 검증엔 불필요
# (번들은 폐기). 통과해야 머지하도록 브랜치 보호에 필수 체크로 건다.
# ★언제 도는가 — ★PR 과 main 뿐이다 (2026-08-11 변경).
#   그전에는 `branches: ['**']` 이라 ★모든 브랜치의 모든 푸시에서 돌았고,
#   PR 작업 중에는 커밋 하나가 ★두 번 검사됐다 — PR 화면에
#   `CI / test (push)` 와 `CI / test (pull_request)` 가 나란히 떴다.
#   Free 플랜 + 비공개 저장소라 Actions 분(分)이 ★유료 계량 대상이다.
#
# ⚠️main 을 남기는 이유 — 브랜치 보호를 못 걸어(Free 플랜) ★main 직접 push 가
#   막히지 않는다. 그때도 검사는 돌아야 한다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build
