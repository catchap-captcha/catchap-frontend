name: CI

# 배포 전 게이트 — push/PR마다 타입체크·빌드·린트. VITE_* 시크릿은 컴파일 검증엔 불필요
# (번들은 폐기). 통과해야 머지하도록 브랜치 보호에 필수 체크로 건다.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build
