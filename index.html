<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaf8" />
    <!-- 다크 모드 깜빡임(FOUC) 방지: React 마운트 전에 저장된 테마를 <html>에 즉시 적용.
         저장값 없으면 OS 설정(prefers-color-scheme)을 따른다. useTheme와 키/규칙 동일. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('catchap-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <!-- Noto Serif KR(Google Fonts) 링크 제거(2026-07-24): src 전체에서 미사용인데도 모든 페이지에서
         렌더블로킹으로 CJK serif 4웨이트를 받고 있었다. 함께 쓰던 fonts.googleapis/gstatic preconnect도
         이 폰트 전용이라 제거. Pretendard(위, 별도 CDN)만 유지 — 시각 변화 없음. -->
    <title>CatChap 캣챱 — 시청 검증형 온라인 강의 플랫폼</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
