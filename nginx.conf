# 프론트 컨테이너 내부 nginx — 정적 SPA 서빙(HTTP 80). TLS는 앞단 Caddy가 종단한다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅 — 실제 파일 없으면 index.html 로 폴백(새로고침·딥링크 404 방지)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시 파일명 정적 자산은 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 캐시 안 함(새 배포 즉시 반영)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
