<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>어린이 숲속 마을 캡차</title>

  <!-- fonts + Three.js (same versions used in the original Canvas prototype) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stage">
    <!-- 3D scene mounts here -->
    <div id="scene3d"></div>

    <!-- ===== SPEECH BUBBLE (top) ===== -->
    <div id="bubble" class="bubble" hidden>
      <div class="bubble-inner">
        <span id="bubbleIcon" class="bubble-icon">🐾</span>
        <span id="bubbleText" class="bubble-text">숨어 있는 동물을 찾아주세요!</span>
      </div>
    </div>

    <!-- refresh (find view) -->
    <button id="btnRefresh" class="corner-btn corner-btn--right" title="새로고침" hidden>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a07c3e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 3.5V9h5.5"></path></svg>
    </button>

    <!-- back (zoom view) -->
    <button id="btnBack" class="corner-btn corner-btn--left corner-btn--float" title="뒤로" hidden>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a07c3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"></path></svg>
    </button>

    <!-- wrong-answer toast -->
    <div id="wrongToast" class="wrong-toast" hidden>
      <div class="wrong-toast-inner">
        <span class="wrong-toast-icon">🔄</span>
        <span>틀렸어요! 새로운 문제로 바뀌어요</span>
      </div>
    </div>

    <!-- ROTATE CONTROL (aim view) -->
    <div id="rotateCard" class="rotate-wrap" hidden>
      <div class="rotate-card">
        <div class="rotate-hint">
          <span class="rotate-hint-icon">🧭</span> 동물을 좌우로 드래그해서 같은 방향으로 돌려주세요!
        </div>
        <div class="rotate-row">
          <!-- 드래그 회전 버전: 기존 좌/우 회전 버튼은 비활성화(숨김) 처리했습니다.
               동물 이미지를 직접 드래그해서 회전합니다. (drag-rotate.js) -->
          <button id="btnLeft" class="rotate-btn" title="왼쪽으로 돌리기" hidden>
            <span class="rotate-btn-icon">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 L4 12 L9 17"></path><path d="M4 12 H16 a4 4 0 0 1 4 4"></path></svg>
            </span>왼쪽
          </button>

          <div class="rotate-pad">
            <div class="rotate-pad-inner">
              <!-- control animal (draggable). Frame set from JS. -->
              <div id="controlSprite" class="control-sprite" draggable="false"></div>
            </div>
          </div>

          <button id="btnRight" class="rotate-btn" title="오른쪽으로 돌리기" hidden>
            오른쪽
            <span class="rotate-btn-icon">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7 L20 12 L15 17"></path><path d="M20 12 H8 a4 4 0 0 0 -4 4"></path></svg>
            </span>
          </button>
        </div>
        <button id="btnConfirm" class="btn-gold">확인</button>
      </div>
    </div>

    <!-- SUCCESS overlay -->
    <div id="successScreen" class="success" hidden>
      <div class="success-card">
        <div class="spark spark-1">✨</div>
        <div class="spark spark-2">✨</div>
        <div class="spark spark-3">⭐</div>
        <div class="success-check">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 L9 17 L4 12"></path></svg>
        </div>
        <div class="success-title">잘했어요!</div>
        <div class="success-sub">확인되었습니다</div>
        <button id="btnReset" class="btn-gold">다시 하기</button>
      </div>
    </div>

    <!-- tiny status line (challenge id / errors) — helps the team during dev -->
    <div id="statusLine" class="status-line"></div>

    <!-- 드래그 회전 디버그 패널 (DEBUG_DRAG_ROTATE === true 일 때만 표시) -->
    <div id="dragDebug" class="drag-debug" hidden>
      <div class="drag-debug-title">🐛 drag-rotate debug</div>
      <div>phase: <b id="dbgPhase">-</b></div>
      <div>현재 프레임: <b id="dbgFrame">-</b></div>
      <div>방향 이름: <b id="dbgName">-</b></div>
      <div>드래그 시작 프레임: <b id="dbgStart">-</b></div>
      <div>이동 거리(deltaX): <b id="dbgDelta">-</b>px</div>
      <div>frameOffset: <b id="dbgOffset">-</b></div>
      <div>최종 스냅 프레임: <b id="dbgSnap">-</b></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/animal-config.js"></script>   <!-- 28마리 동물 단일 설정 -->
  <script src="js/captcha.js"></script>
  <script src="js/drag-rotate.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
